name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  services:
    name: ${{ matrix.package }} typecheck, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - gateway
          - auth-service
          - medicine-service
          - inventory-service
          - notification-service
          - sales-service
          - purchase-service
          - reporting-service
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dev-seed:
    name: Dev seed typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dev-seed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/dev-seed/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    name: Docker compose config
    runs-on: ubuntu-latest
    needs: [frontend, services]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
